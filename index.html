<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#fefcf0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Daypad</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: nothing but paper. A ruled page that pans forever; one small date in the corner; everything else appears only when touched. */
:root{
  --bg:#fefcf0; --rule:#e6dfc4; --fg:#2b2822; --muted:#a39c86; color-scheme:light;
  --accent:#2a5f8a; --danger:#a33a2a;
  --f-body:"IBM Plex Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;background:none;border:none;padding:4px 8px;cursor:pointer;border-radius:6px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#canvas{position:fixed;inset:0;overflow:hidden;cursor:text;
  background-image:linear-gradient(to bottom,transparent calc(100% - 1px),var(--rule) calc(100% - 1px));background-size:100% 32px;background-position:0 0}
#canvas.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#rules{position:absolute;left:-100000px;top:-100000px;width:200000px;height:200000px;pointer-events:none}
/* date in the corner */
.date{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:20;
  font:13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.date{display:flex;gap:2px;align-items:center}
.date button{padding:4px 6px;color:inherit}
.date .fit{opacity:.75}.date .fit:hover{opacity:1;color:var(--fg)}
.date .menu{display:flex;flex-direction:column;align-items:flex-start;background:var(--bg);box-shadow:0 2px 12px rgba(0,0,0,.15);border-radius:8px;padding:4px}
.date .menu button.cur{color:var(--fg)}
/* photo in the other corner */
.photo{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;
  width:40px;height:40px;padding:0;color:var(--muted);font-size:22px;line-height:1}
.photo:hover{color:var(--fg)}
/* a note is just text (or a picture) on the page */
.card{position:absolute;width:260px;cursor:default}
.card.img{width:280px}
.card .head{display:flex;align-items:center;gap:2px;position:absolute;left:0;bottom:100%;padding:0 0 2px;
  opacity:0;pointer-events:none;transition:opacity .12s;white-space:nowrap}
.card.on .head,.card:focus-within .head{opacity:1;pointer-events:auto}
.card .grip{font:12px var(--f-mono);color:var(--muted);cursor:grab;padding:4px 8px 4px 0;font-variant-numeric:tabular-nums}
.card .grip.drag{cursor:grabbing}
.card .head button{font-size:12px;color:var(--muted);padding:4px 7px}
.card .head button:hover{color:var(--fg)}
.card .del{color:var(--danger)}
.card .body{padding:2px 0;font-size:16px;line-height:32px;white-space:pre-wrap;word-break:break-word;
  -webkit-user-select:text;user-select:text;cursor:text;font-family:var(--f-mono)}
.card .body.prose{font-family:var(--f-body)}
.card .body[contenteditable="true"],.card .body[contenteditable="plaintext-only"]{outline:none;color:var(--accent)}
.card img{display:block;width:100%;max-width:100%;border-radius:3px}
.card.on img{outline:1px solid var(--accent);outline-offset:3px}
.card.copied .body{color:var(--accent)}
/* the input is only a caret on the page */
.mark{position:absolute;width:260px;cursor:default}
.mark textarea{display:block;width:100%;box-sizing:border-box;min-height:32px;border:none;background:none;resize:none;padding:2px 0;
  font:16px var(--f-body);line-height:32px;color:var(--fg);outline:none;-webkit-user-select:text;user-select:text;caret-color:var(--accent);overflow:hidden}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;
  font:13px var(--f-body);color:var(--muted);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast,.card .head{transition:none}}
</style>
</head>
<body>

<div class="date" id="date"></div>
<div id="canvas"><div id="world"><div id="rules"></div></div></div>
<input id="file" type="file" accept="image/*" multiple hidden>
<div class="toast" id="toast"></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const canvas=$('#canvas'),world=$('#world'),toast=$('#toast'),dateEl=$('#date'),dayBtn=$('#daybtn');
const KEY='wnote.v2',KEEP_DAYS=3,LINE=32;
let notes=[],view={x:40,y:90,k:1},target=null,mark=null,lastTap=null,menuOpen=false;
let boards={},day=today();
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function daysAgo(s){const [y,m,d]=s.split('-').map(Number);return Math.round((new Date().setHours(0,0,0,0)-new Date(y,m-1,d).getTime())/864e5)}
function label(s){const n=daysAgo(s);return (n===0?'오늘 ':n===1?'어제 ':'')+s.slice(5).replace('-','.')}
function snap(v){return Math.round(v/LINE)*LINE}

/* ---- storage (best effort) ---- */
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.boards)boards=s.boards}catch(e){}
  for(const k of Object.keys(boards))if(daysAgo(k)>=KEEP_DAYS)delete boards[k]; /* 3일 지난 판은 지움 */
  openDay(today());
}
function openDay(k){day=k;const b=boards[k]||{notes:[],view:{x:40,y:90,k:1}};boards[k]=b;notes=b.notes;view=b.view;clearTarget();render();dayBar();if(notes.length)fitAll();else applyView()}
function fitAll(){ /* bring every note on this day into one screen */
  if(!notes.length){view={x:40,y:90,k:1};applyView();save();say('아직 적은 게 없어요');return}
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const n of notes){const el=world.querySelector('.card[data-id="'+n.id+'"]');const w=el?el.offsetWidth:260,h=el?el.offsetHeight:120;
    x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+w);y1=Math.max(y1,n.y+h)}
  const pad=48,top=56,bot=72;
  const k=Math.min(1.25,Math.max(.2,Math.min((innerWidth-pad*2)/(x1-x0),(innerHeight-top-bot)/(y1-y0))));
  view={k,x:(innerWidth-(x1-x0)*k)/2-x0*k,y:top+(innerHeight-top-bot-(y1-y0)*k)/2-y0*k};applyView();save()}
document.addEventListener('keydown',e=>{if(e.key==='Home'&&!(e.target.closest&&(e.target.closest('textarea')||e.target.isContentEditable))){e.preventDefault();fitAll()}});
function save(){boards[day]={notes,view};for(const k of Object.keys(boards))if(!boards[k].notes.length&&k!==day)delete boards[k];
  try{localStorage.setItem(KEY,JSON.stringify({boards}))}catch(e){say('저장 공간이 가득 찼어요. 사진을 몇 장 지워 주세요.')}}
function dayBar(){
  dateEl.innerHTML='';
  if(!menuOpen){const b=document.createElement('button');b.type='button';b.textContent=label(day);b.onclick=()=>{menuOpen=true;dayBar()};dateEl.appendChild(b);
    const f=document.createElement('button');f.type='button';f.className='fit';f.textContent='모아보기';f.title='적은 것 전부 한 화면에 (Home 키)';f.onclick=fitAll;dateEl.appendChild(f);return}
  const m=document.createElement('div');m.className='menu';
  const keys=[...new Set([today(),...Object.keys(boards)])].sort().reverse();
  for(const k of keys){const b=document.createElement('button');b.type='button';b.textContent=label(k)+(boards[k]&&boards[k].notes.length?'  ·'+boards[k].notes.length:'');
    b.className=k===day?'cur':'';b.onclick=()=>{menuOpen=false;save();openDay(k)};m.appendChild(b)}
  dateEl.appendChild(m);
}

/* ---- helpers ---- */
function say(m){toast.textContent=m;toast.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('on'),1600)}
function stamp(){const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;
  const s=LINE*view.k;canvas.style.backgroundSize=`100% ${s}px`;canvas.style.backgroundPosition=`0 ${((view.y%s)+s)%s}px`}
function toWorld(cx,cy){return{x:(cx-view.x)/view.k,y:(cy-view.y)/view.k}}
function spot(){ /* the tapped spot, else below the last note, else near the top-left of the screen */
  if(target){const p={x:target.x,y:target.y};clearTarget();return p}
  const c=toWorld(24,80);
  if(!notes.length)return{x:c.x,y:snap(c.y)};
  let maxY=-Infinity,x=c.x;
  for(const n of notes){if(n.y>maxY){maxY=n.y;x=n.x}}
  return{x,y:snap(maxY+LINE*3)};
}
function isProse(t){return !/[{};<>=]|^\s{2,}/m.test(t)&&t.split('\n').length<6}

/* ---- render ---- */
function render(){
  world.querySelectorAll('.card').forEach(c=>c.remove());
  for(const n of notes)world.appendChild(cardEl(n));
  if(target&&mark)world.appendChild(mark);
}
function cardEl(n){
  const el=document.createElement('div');el.className='card'+(n.type==='img'?' img':'');el.dataset.id=n.id;
  el.style.left=n.x+'px';el.style.top=n.y+'px';
  const head=document.createElement('div');head.className='head';
  const g=document.createElement('span');g.className='grip';g.textContent='⠿ '+n.at;head.appendChild(g);
  if(n.type==='text'){
    const cp=document.createElement('button');cp.type='button';cp.textContent='복사';cp.onclick=e=>{e.stopPropagation();copy(n,el)};head.appendChild(cp);
    const ed=document.createElement('button');ed.type='button';ed.textContent='수정';ed.onclick=e=>{e.stopPropagation();const b=el.querySelector('.body');
      if(b.isContentEditable){finishEdit(b,n,el)}
      else{b.contentEditable='plaintext-only';if(!b.isContentEditable)b.contentEditable='true';ed.textContent='완료';b.focus();
        b.onblur=()=>finishEdit(b,n,el)}};head.appendChild(ed)}
  const del=document.createElement('button');del.type='button';del.className='del';del.textContent='지움';
  del.onclick=e=>{e.stopPropagation();notes=notes.filter(m=>m.id!==n.id);save();render()};
  head.appendChild(del);el.appendChild(head);
  if(n.type==='text'){const b=document.createElement('div');b.className='body'+(isProse(n.text)?' prose':'');b.textContent=n.text;el.appendChild(b)}
  else{const im=document.createElement('img');im.src=n.src;im.alt='붙여넣은 그림';im.draggable=false;el.appendChild(im)}
  dragCard(g,el,n);
  el.addEventListener('pointerdown',e=>{e.stopPropagation();document.querySelectorAll('.card.on').forEach(c=>{if(c!==el)c.classList.remove('on')});el.classList.add('on')});
  return el;
}
function finishEdit(b,n,el){if(!b.isContentEditable)return;b.contentEditable='false';b.onblur=null;n.text=b.innerText.trim();
  if(!n.text)notes=notes.filter(m=>m.id!==n.id);save();render()}
function copy(n,el){
  const done=()=>{el.classList.add('copied');say('복사했어요');setTimeout(()=>el.classList.remove('copied'),700)};
  const fallback=()=>{const r=document.createRange();r.selectNodeContents(el.querySelector('.body'));const s=getSelection();s.removeAllRanges();s.addRange(r);say('글을 선택했어요. 길게 눌러 복사하세요')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(n.text).then(done,fallback);else fallback();
}

/* ---- the input: a bare caret on the page; leaving it keeps the text ---- */
function setTarget(p){target={x:p.x,y:snap(p.y-LINE/2)};
  if(!mark){mark=document.createElement('div');mark.className='mark';
    const ta=document.createElement('textarea');ta.id='inbox';ta.rows=1;mark.appendChild(ta);
    mark.addEventListener('pointerdown',e=>e.stopPropagation());
    /* the caret box sits under the cursor after the first click, so the second click of a double-click lands here */
    ta.addEventListener('pointerdown',e=>{const now=Date.now();
      if(!ta.value.trim()&&lastTap&&now-lastTap.t<400&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<24){e.preventDefault();lastTap=null;pasteAt(toWorld(e.clientX,e.clientY))}
      else lastTap={t:now,x:e.clientX,y:e.clientY}});
    ta.addEventListener('paste',e=>{if(takePaste(e.clipboardData))e.preventDefault()});
    ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px'});
    ta.addEventListener('keydown',e=>{if(e.key==='Escape'){ta.value='';clearTarget()}if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();ta.blur()}});
    ta.addEventListener('blur',()=>{const v=ta.value;if(v.trim())addText(v);else if(target)clearTarget()});
  }
  mark.style.left=target.x+'px';mark.style.top=target.y+'px';world.appendChild(mark);
  const ta=mark.querySelector('textarea');ta.value='';ta.style.height='';setTimeout(()=>ta.focus(),0)}
function clearTarget(){target=null;if(mark){mark.querySelector('textarea').value='';mark.remove()}}

/* double tap/click: read the clipboard straight into that spot; when the browser refuses, leave the caret there */
async function pasteAt(p){
  setTarget(p);
  try{
    if(!navigator.clipboard||!navigator.clipboard.read)throw 0;
    const items=await navigator.clipboard.read();let got=false;
    for(const it of items){
      const img=it.types.find(t=>t.startsWith('image/'));
      if(img){addImage(await it.getType(img));got=true;break}
      if(it.types.includes('text/plain')){addText(await (await it.getType('text/plain')).text());got=true;break}
    }
    if(!got)say('클립보드가 비어 있어요');
  }catch(e){if(!mark||!mark.isConnected)setTarget(p);say('여기서 Ctrl+V 또는 길게 눌러 붙여넣기')}
}

/* ---- add ---- */
function addText(text){text=(text||'').replace(/\r\n/g,'\n').trim();if(!text)return;const p=spot();
  notes.push({id:Date.now()+Math.random().toString(16).slice(2),type:'text',text,at:stamp(),x:p.x,y:p.y});save();render();bringToView(p)}
function addImage(file){
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
    const MAX=1000,s=Math.min(1,MAX/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const p=spot();notes.push({id:Date.now()+Math.random().toString(16).slice(2),type:'img',src:c.toDataURL('image/jpeg',.82),at:stamp(),x:p.x,y:p.y});
    save();render();bringToView(p)};img.src=r.result};r.readAsDataURL(file);
}
function bringToView(p){const sx=p.x*view.k+view.x,sy=p.y*view.k+view.y;
  if(sx<0||sy<40||sx>innerWidth-120||sy>innerHeight-120){view.x=innerWidth/2-(p.x+120)*view.k;view.y=innerHeight/2-(p.y+60)*view.k;applyView();save()}}
function takePaste(dt){
  if(!dt)return false;let got=false;
  for(const f of dt.files||[])if(f.type.startsWith('image/')){addImage(f);got=true}
  if(!got){const t=dt.getData('text/plain');if(t){addText(t);got=true}}
  return got;
}
document.addEventListener('paste',e=>{
  if(e.target.closest&&(e.target.closest('.mark')||e.target.isContentEditable))return;
  if(takePaste(e.clipboardData))e.preventDefault();
});
$('#file').onchange=e=>{for(const f of e.target.files)addImage(f);e.target.value=''};
canvas.addEventListener('dragover',e=>e.preventDefault());
canvas.addEventListener('drop',e=>{e.preventDefault();setTarget(toWorld(e.clientX,e.clientY));takePaste(e.dataTransfer)});

/* ---- pan / zoom ---- */
let pan=null,pinch=null,pointers=new Map();
canvas.addEventListener('pointerdown',e=>{
  if(e.target!==canvas&&e.target!==world&&e.target.id!=='rules')return;
  if(menuOpen){menuOpen=false;dayBar()}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);
  if(pointers.size===1){pan={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,moved:false}}
  else if(pointers.size===2){const[a,b]=[...pointers.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:view.k,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,vx:view.x,vy:view.y};pan=null}
});
canvas.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pointers.size===2){const[a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    const k=Math.min(3,Math.max(.25,pinch.k*d/pinch.d));const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    view.x=cx-(pinch.cx-pinch.vx)*(k/pinch.k);view.y=cy-(pinch.cy-pinch.vy)*(k/pinch.k);view.k=k;applyView();return}
  if(pan){const dx=e.clientX-pan.sx,dy=e.clientY-pan.sy;if(Math.abs(dx)+Math.abs(dy)>6){pan.moved=true;canvas.classList.add('panning')}
    view.x=pan.vx+dx;view.y=pan.vy+dy;applyView()}
});
function endPointer(e){pointers.delete(e.pointerId);
  if(pan&&!pan.moved&&e.type==='pointerup'){
    document.querySelectorAll('.card.on').forEach(c=>c.classList.remove('on'));
    const now=Date.now(),p=toWorld(e.clientX,e.clientY);
    const open=!!(mark&&mark.isConnected&&!mark.querySelector('textarea').value.trim());
    if(lastTap&&now-lastTap.t<400&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<24){lastTap=null;pasteAt(p)}
    else{lastTap={t:now,x:e.clientX,y:e.clientY};if(open)clearTarget();else setTarget(p)}}
  if(pointers.size<2)pinch=null;if(pointers.size===0){pan=null;canvas.classList.remove('panning');save()}}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{e.preventDefault();
  if(e.ctrlKey||e.metaKey){const k=Math.min(3,Math.max(.25,view.k*Math.exp(-e.deltaY*.002)));const r=k/view.k;
    view.x=e.clientX-(e.clientX-view.x)*r;view.y=e.clientY-(e.clientY-view.y)*r;view.k=k}
  else{view.x-=e.deltaX;view.y-=e.deltaY}
  applyView()},{passive:false});

/* ---- move a note by its grip ---- */
function dragCard(handle,el,n){
  let st=null;
  handle.addEventListener('pointerdown',e=>{e.stopPropagation();st={sx:e.clientX,sy:e.clientY,x:n.x,y:n.y};handle.setPointerCapture(e.pointerId);handle.classList.add('drag');el.style.zIndex=10});
  handle.addEventListener('pointermove',e=>{if(!st)return;n.x=st.x+(e.clientX-st.sx)/view.k;n.y=st.y+(e.clientY-st.sy)/view.k;
    el.style.left=n.x+'px';el.style.top=n.y+'px'});
  const up=()=>{if(!st)return;st=null;n.y=snap(n.y);el.style.top=n.y+'px';handle.classList.remove('drag');el.style.zIndex='';save()};
  handle.addEventListener('pointerup',up);handle.addEventListener('pointercancel',up);
}

load();
setInterval(()=>{if(!menuOpen)dayBar()},60000);
})();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
